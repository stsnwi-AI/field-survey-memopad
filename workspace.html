<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>現場調査メモパッド | 複数PDFワークスペース</title>
<style>
:root{font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;color:#173d53;background:#e8f0f4}
*{box-sizing:border-box}body{margin:0;display:flex;flex-direction:column;height:100dvh;overflow:hidden}header{height:42px;flex:none;order:1;background:#173e52;color:white;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 12px}
header strong{font-size:15px}header small{font-size:11px;color:#cce3ef}header .actions{display:flex;gap:6px;align-items:center}
button,.add{font:inherit;cursor:pointer;border-radius:7px;border:1px solid #abc4d2;background:white;color:#14394c;padding:8px 10px;min-height:38px;font-size:13px}
button:focus-visible,.add:focus-within{outline:3px solid #4aa3d3}
.add{display:inline-flex;gap:4px;align-items:center;font-weight:700}#addFiles{position:absolute;opacity:0;width:1px;height:1px}
#tabs{height:42px;flex:none;order:0;display:flex;gap:5px;align-items:center;overflow-x:auto;background:#d4e5ef;border-bottom:1px solid #96b5c5;padding:5px 8px;scrollbar-width:thin}
.tab-wrap{display:flex;flex:none;align-items:center;gap:0;max-width:285px;min-width:135px;background:#eaf1f6;border:1px solid #a2bccc;border-radius:7px;overflow:hidden}
.tab-wrap:has(.tab[aria-selected=true]){background:white;border-bottom:3px solid #0f769e}
.tab-close{border:0!important;border-radius:0!important;background:transparent!important;min-width:34px;min-height:38px;padding:5px;font-size:19px;flex:none}
.tab-close:hover,.tab-close:focus-visible{background:#ffe7e7!important;color:#a32d2d}
.tab{flex:1;min-width:0;max-width:240px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:left;background:transparent;border:0;min-height:38px}
.tab[aria-selected=true]{background:white;font-weight:750}
.tab small{display:block;color:#698393;font-size:10px;white-space:nowrap}
#workspace{position:relative;flex:1 1 auto;min-height:0;order:2;overflow:hidden}
.document-frame{border:0;width:100%;height:100%;position:absolute;inset:0;visibility:hidden;pointer-events:none;background:white}
.document-frame.active{visibility:visible;pointer-events:auto;z-index:2}
#empty[hidden]{display:none}#empty{display:grid;place-content:center;height:100%;text-align:center;gap:15px;padding:20px;color:#456579}
#empty h2{margin:0;font-size:21px}#empty p{margin:0;font-size:14px}#empty .first-file{margin:4px auto 2px;min-height:48px;padding:11px 20px;background:#e7f1f6;border:2px solid #8ab4ca;color:#184c68;cursor:pointer}
#status[hidden]{display:none!important}#status{font-size:12px;position:fixed;bottom:6px;left:8px;max-width:calc(100% - 16px);padding:5px 8px;background:#fffef2e8;border-radius:6px;z-index:8;pointer-events:none}
@media(max-width:650px){header{height:40px;padding:2px 7px}header strong{font-size:12px}header small{display:none}.add{padding:7px 9px;font-size:12px}#tabs{height:41px}#workspace{min-height:0}.tab-wrap{min-width:120px;max-width:205px}.tab{max-width:155px}}
 
/* v1.4.53: restore original illustrated welcome visual on the default workspace.
   No PDF data / editor interactions changed. */
#workspace:has(#empty:not([hidden])){overflow-y:auto;background:#f2f6f8}
#empty.home-welcome{
 display:flex;align-items:flex-start;justify-content:center;
 min-height:100%;height:auto;padding:clamp(16px,3vh,34px) 12px 48px;
 color:#24485b;text-align:center;
}
#empty.home-welcome[hidden]{display:none!important}
.home-welcome-card{
 width:min(760px,100%);padding:clamp(18px,3vw,32px);
 background:#fbfdfe;border:1px solid #c5d6df;
 border-top:4px solid #df9b3d;border-radius:12px;
 box-shadow:0 8px 28px #183f5416;
}
.home-welcome .hero-art{width:min(440px,95%);margin:0 auto 16px}
.home-welcome .hero-art svg{width:100%;height:auto;display:block}
.home-welcome .welcome-chip{
 display:inline-flex;align-items:center;gap:7px;
 background:#1c465c;color:#fff;border-radius:6px;
 padding:7px 13px;font-size:11px;font-weight:750;letter-spacing:.045em
}
.home-welcome .welcome-chip .ui-icon{width:15px;height:15px;color:#ffc873}
.home-welcome h1{font-size:clamp(22px,3vw,32px);color:#173e52;margin:16px 0 10px}
.home-welcome p{font-size:clamp(12px,1.6vw,14px);line-height:1.8;color:#476475}
.home-welcome .first-file{
 display:inline-flex;margin:12px auto 8px;min-height:50px;
 padding:13px 23px;background:#df8427;color:white;
 border:2px solid #c3731d;border-radius:8px;
 box-shadow:0 3px 8px #b16c2424;font-size:15px;cursor:pointer
}
.home-welcome .first-file:hover{background:#ca7521;color:white}
.home-welcome .first-file:focus-within{
 outline:3px solid #2b7baa;outline-offset:3px
}
.home-welcome .welcome-features{
 display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0
}
.home-welcome .welcome-features span{
 display:inline-flex;align-items:center;gap:6px;padding:8px 11px;
 background:#eef5f9;border:1px solid #c7dce6;border-radius:6px;
 color:#2a5367;font-size:12px;font-weight:600
}
.home-welcome .welcome-features .ui-icon{width:17px;height:17px}
.home-welcome .home-save-reminder{font-size:11px;color:#607788;margin-top:16px}
.home-welcome .home-subtext{font-weight:550}
@media(max-width:600px){
 #empty.home-welcome{padding:10px 8px 32px}
 .home-welcome-card{padding:14px 12px;border-radius:8px}
 .home-welcome .hero-art{width:min(330px,96%);margin-bottom:10px}
 .home-welcome h1{margin:11px 0 8px}
 .home-welcome .first-file{width:100%;justify-content:center}
 .home-welcome .welcome-features span{font-size:11px;padding:7px 9px}
}
/* Once a PDF is open, PDF addition is available inside its editor icon row. */
body:has(.document-frame.active) > header{display:none!important}
body:has(.document-frame.active) > #workspace{flex:1 1 auto!important;min-height:0!important}

/* v1.4.74: PDF tabs use 27px instead of 42px. Open-PDF editor header is 36px. */
#tabs{height:27px!important;min-height:27px!important;padding:1px 4px!important;gap:3px!important}
.tab-wrap{height:25px!important;min-height:25px!important;min-width:100px!important;max-width:220px!important;border-radius:4px!important}
.tab,.tab-close{min-height:24px!important;height:24px!important;padding:1px 5px!important;font-size:11px!important;border-radius:3px!important}
.tab-close{min-width:25px!important;font-size:16px!important;line-height:1!important}
@media(max-width:650px){
 #tabs{height:27px!important}
 .tab-wrap{min-width:86px!important;max-width:155px!important}
 .tab{max-width:125px!important}
}
</style></head><body>
<header><div><strong>現場調査メモパッド｜PDF編集</strong><small> Ver.1.4.80-dev ／図面ごとに編集状態を保持</small></div>
<div class="actions"><label class="add" for="addFiles">＋ PDFを追加<input id="addFiles" type="file" accept="application/pdf,.pdf" multiple></label></div></header>
<nav id="tabs" role="tablist" aria-label="開いているPDF"></nav>
<main id="workspace"><div id="empty" class="home-welcome">
<div class="home-welcome-card"><div class="hero-art" aria-hidden="true"><svg viewBox="0 0 440 224" role="img" focusable="false" xmlns="http://www.w3.org/2000/svg">
<rect x="6" y="8" width="428" height="207" rx="8" fill="#e1eaee" stroke="#91aebc" stroke-width="2"/>
<rect x="22" y="22" width="396" height="173" fill="#f9fcfd" stroke="#6e97a9" stroke-width="1.4"/>
<path d="M22 53H418M54 22V195M235 22V195M320 22V195M54 115H320M235 148H418" stroke="#8aa9b6" stroke-width="2" fill="none"/>
<path d="M96 53V115H164V158H235M270 22V83H320" fill="none" stroke="#b7cbd3" stroke-width="1.6" stroke-dasharray="5 4"/>
<path d="M84 168 L127 168 L155 137 L207 137 L262 83 L350 83" stroke="#e18c22" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path d="M80 164l8 8m0-8-8 8" stroke="#e18c22" stroke-width="3"/>
<rect x="172" y="93" width="33" height="27" fill="#f5e7d2" stroke="#e18c22" stroke-width="2"/><path d="M177 107h23" stroke="#d48a2e"/>
<circle cx="155" cy="137" r="16" fill="#df8022" stroke="white" stroke-width="3"/><text x="155" y="142" fill="white" text-anchor="middle" font-size="11" font-weight="800" font-family="Arial">001</text>
<circle cx="263" cy="83" r="16" fill="#df8022" stroke="white" stroke-width="3"/><text x="263" y="88" fill="white" text-anchor="middle" font-size="11" font-weight="800" font-family="Arial">002</text>
<circle cx="349" cy="83" r="16" fill="#df8022" stroke="white" stroke-width="3"/><text x="349" y="88" fill="white" text-anchor="middle" font-size="11" font-weight="800" font-family="Arial">003</text>
<rect x="22" y="195" width="396" height="20" fill="#173e50"/>
<text x="33" y="209" fill="#fff" font-size="10" font-weight="700" font-family="Arial">FIELD SURVEY // PLAN MARKUP</text>
<text x="404" y="209" fill="#ffca6d" text-anchor="end" font-size="10" font-family="Arial">001 — 003</text>
</svg></div><div class="welcome-chip"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/></svg>FIELD SURVEY / 調査記録・施工指示</div><h1>図面を開いて、現場を記録。</h1><p>調査位置に番号を置き、写真・状況・施工指示をひとまとめに。 配線ルートの手書きや図面編集も、同じ画面で。</p>
<label class="add first-file" for="addFiles"><span>＋ PDFを開いて調査を始める</span></label>
<p class="home-subtext">1枚目を編集したまま、別のPDFを追加・切り替えできます。PDFの各ページは縦スクロールで表示します。</p>
<div class="welcome-features"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M12 6v14M8 20h8M4 6V4m16 2V4"/></svg>図面に記入</span><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m13 3 7 7-8 8-7-7zM5 11l-2 7 7-2M3 21h17"/></svg>調査位置に番号</span><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="3" width="13" height="16" rx="3"/><path d="M4 7v12a2 2 0 0 0 2 2h10M11 8h5M11 12h5"/></svg>図面を整理</span></div>
<p class="home-save-reminder">調査番号・写真・コメント・書き込みを残すには、各PDFの「編集済みPDFを保存」を使用してください。</p>
</div></div></main>
<div id="status" role="status" aria-live="polite" hidden></div>
<script>
(()=>{'use strict';
 const input=document.getElementById('addFiles'),tabs=document.getElementById('tabs'),workspace=document.getElementById('workspace'),empty=document.getElementById('empty'),status=document.getElementById('status');
 const documents=[];let activeId=null,serial=0;
 const handoffToken=new URLSearchParams(location.search).get('transfer');
 let handoffChannel=null,requestTimer=null;
 function isHandoffToken(v){return typeof v==='string'&&/^[0-9a-f-]{32,40}$/i.test(v)}

 function setStatus(message){
   status.textContent=message;
   // Normal tab/restore notifications are internal, not a permanent bottom banner.
   // Preserve actionable warnings and errors for the user.
   status.hidden=!/(失敗|エラー|開けません|できません|確認できません|無効|不正|タイムアウト|必要です)/.test(message);
 }
 function activate(id){
   const doc=documents.find(d=>d.id===id);
   if(!doc)return;
   activeId=id;
   for(const d of documents){d.frame.classList.toggle('active',d.id===id);d.tab.setAttribute('aria-selected',String(d.id===id));d.frame.setAttribute('aria-hidden',String(d.id!==id))}
   doc.tab.scrollIntoView({block:'nearest',inline:'nearest'});
   setStatus(doc.name+' を表示中。別タブへ切り替えても編集内容は保持されます。');
 }
 function closePDF(id){
   const index=documents.findIndex(d=>d.id===id);
   if(index<0)return;
   const d=documents[index];
   let unsaved=true;
   try{unsaved=d.frame.contentWindow?.dirty!==false}catch{}
   const question='「'+d.name+'」を閉じますか？'+
    (unsaved?'このタブには未保存の編集がある可能性があります。':'このPDFの保存状態を確認してください。')+
    '保存していない書き込み・写真・コメントは失われます。必要ならキャンセルして「編集済みPDFを保存」を押してください。元のPDFは削除されません。';
   if(!confirm(question))return;
   documents.splice(index,1);
   d.frame.remove();d.wrapper.remove();
   if(id===activeId){
     activeId=null;
     const next=documents[Math.min(index,documents.length-1)];
     if(next)activate(next.id);
   }
   if(!documents.length){empty.hidden=false;setStatus('すべてのPDFタブを閉じました。必要なファイルを追加してください。')}
 }
 async function appendPDF(file){
   if(!file||!(/\.pdf$/i.test(file.name)||file.type==='application/pdf')){setStatus('PDFファイルを選択してください');return}
   const id='pdf-tab-'+(++serial),tab=document.createElement('button'),frame=document.createElement('iframe');
   const wrapper=document.createElement('div'),close=document.createElement('button');
   wrapper.className='tab-wrap';
   tab.className='tab';tab.type='button';tab.setAttribute('role','tab');tab.setAttribute('aria-selected','false');tab.textContent=file.name;tab.title=file.name;
   close.className='tab-close';close.type='button';close.textContent='×';close.title='このPDFを閉じる';
   close.setAttribute('aria-label',file.name+'を閉じる');
   frame.className='document-frame';frame.title=file.name;frame.setAttribute('aria-hidden','true');
   const doc={id,name:file.name,tab,frame,wrapper};
   tab.addEventListener('click',()=>activate(id));
   close.addEventListener('click',()=>closePDF(id));
   wrapper.append(tab,close);
   documents.push(doc);tabs.append(wrapper);workspace.append(frame);empty.hidden=true;
   activate(id);setStatus(file.name+' を読み込み中…');
   try{
     const buffer=await file.arrayBuffer();
     await new Promise((resolve,reject)=>{
       const timer=setTimeout(()=>reject(new Error('読み込みタイムアウト')),30000);
       frame.addEventListener('load',()=>{clearTimeout(timer);resolve()},{once:true});
       frame.addEventListener('error',()=>{clearTimeout(timer);reject(new Error('編集画面が開けません'))},{once:true});
       frame.src='index.html?workspacePane=1&tab='+encodeURIComponent(id);
     });
     if(typeof frame.contentWindow.load!=='function')throw new Error('PDF編集機能が読み込めません');
     // Each frame owns independent source PDFs, undo history, survey photos and notes.
     // Transfer a fresh copy; never replace the state of another open document.
     await frame.contentWindow.load(buffer,file.name);
     activate(id);
   }catch(err){
     setStatus(file.name+' を開けませんでした：'+err.message);
     tab.title=file.name+'（読み込み失敗）';
   }
 }
 // Import the currently edited PDF from the previous editor without
 // closing that editor. The project contains original PDFs + annotations +
 // survey photo/comment data; no server or cross-origin transfer is used.
 async function appendTransferredProject(payload){
   const project=payload?.project;
   if(!project||project.format!=='kantan-pdf-project'||!Array.isArray(project.pageEntries))throw Error('編集情報の形式が異なります');
   const id='pdf-tab-'+(++serial),tab=document.createElement('button'),frame=document.createElement('iframe');
   const wrapper=document.createElement('div'),close=document.createElement('button');
   const name=project.originalPdfName||'編集中.pdf';
   wrapper.className='tab-wrap';tab.className='tab';tab.type='button';tab.setAttribute('role','tab');tab.setAttribute('aria-selected','false');tab.textContent=name;tab.title=name;
   close.className='tab-close';close.type='button';close.textContent='×';close.title='このPDFを閉じる';close.setAttribute('aria-label',name+'を閉じる');
   frame.className='document-frame';frame.title=name;frame.setAttribute('aria-hidden','true');
   const doc={id,name,tab,frame,wrapper};
   tab.addEventListener('click',()=>activate(id));close.addEventListener('click',()=>closePDF(id));
   wrapper.append(tab,close);documents.push(doc);tabs.append(wrapper);workspace.append(frame);empty.hidden=true;activate(id);
   try{
     await new Promise((resolve,reject)=>{
       const timer=setTimeout(()=>reject(new Error('編集画面を読み込めません')),30000);
       frame.addEventListener('load',()=>{clearTimeout(timer);resolve()},{once:true});
       frame.addEventListener('error',()=>{clearTimeout(timer);reject(new Error('編集画面を読み込めません'))},{once:true});
       frame.src='index.html?workspacePane=1&tab='+encodeURIComponent(id);
     });
     const editor=frame.contentWindow;
     if(typeof editor.restoreWorkspaceProject!=='function')throw Error('編集データ受け渡し機能がありません');
     await editor.restoreWorkspaceProject(project,payload.history,payload.redoStack,payload.dirty);
     activate(id);
     setStatus('編集中のPDF「'+name+'」を引き継ぎました。元の編集画面も保持されています。');
   }catch(err){
     setStatus(name+'の引継ぎに失敗しました：'+err.message+'。元のPDF編集画面はそのままです。');
     documents.splice(documents.indexOf(doc),1);frame.remove();wrapper.remove();
     if(!documents.length){empty.hidden=false;activeId=null}
   }
 }
 if(isHandoffToken(handoffToken)&&typeof BroadcastChannel!=='undefined'){
   handoffChannel=new BroadcastChannel('field-survey-workspace-'+handoffToken);
   let received=false,tries=0;
   handoffChannel.onmessage=async e=>{
     if(received||e.data?.token!==handoffToken)return;
     if(e.data.type==='handoff-error'){
       received=true;clearInterval(requestTimer);
       setStatus('編集中PDFを移せませんでした：'+e.data.message+'。元の編集画面はそのまま保持されています。');
       handoffChannel.close();return;
     }
     if(e.data.type!=='handoff-project')return;
     received=true;clearInterval(requestTimer);
     try{await appendTransferredProject(e.data.payload)}
     catch(err){setStatus('編集中PDFの引継ぎに失敗しました：'+err.message)}
     finally{handoffChannel.close()}
   };
   handoffChannel.postMessage({type:'handoff-ready',token:handoffToken});
   requestTimer=setInterval(()=>{
     if(received||++tries>60){clearInterval(requestTimer);if(!received){setStatus('前のPDFの受け渡しを確認できません。元の編集画面からもう一度開いてください。');handoffChannel.close()}return}
     handoffChannel.postMessage({type:'handoff-ready',token:handoffToken});
   },500);
 }
 input.addEventListener('change',async e=>{
   const files=Array.from(e.target.files||[]);input.value='';
   for(const file of files)await appendPDF(file);
 });
 window.addEventListener('beforeunload',e=>{
   if(documents.some(d=>{try{return d.frame.contentWindow?.dirty===true}catch{return false}})){e.preventDefault();e.returnValue=''}
 });
})();
</script></body></html>
